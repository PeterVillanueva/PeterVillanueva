# Generates profile-3d-city.svg via lowlighter/metrics. Needs secret METRICS_TOKEN.
# Disabled while the profile uses the Andrew-style SVG README. Keep for later if needed.
name: 3D city (isometric calendar)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: profile-3d-city.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
