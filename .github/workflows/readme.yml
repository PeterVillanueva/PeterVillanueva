name: README build
on:
  push:
    branches:
      - main
      - ascii-profile-readme
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README SVG
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: PeterVillanueva
        run: python today.py
      - name: Commit
        run: |-
          git add dark_mode.svg light_mode.svg cache
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Updated README stats" || echo "No changes to commit"
          git push
